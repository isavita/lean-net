name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev libbrotli-dev pkg-config curl
      - uses: leanprover/lean-action@v1
      - name: Build and test TCP, HTTP/1.1 and h2c
        run: |
          lake build lean-net-http1-fixture lean-net-http2-fixture lean-net-event-ffi-test lean-net-transport-test lean-net-ffi-live lean-net-pool-lifetime-test lean-net-gateway-pool-test lean-net-gateway-engine-test lean-net-gateway-h1-streaming-test lean-net-gateway-h2-streaming-test
          lake build
          lake build LeanNet.Gate.Literal
          lake env lean test/LeanNetTest.lean
          lake env lean --run test/HTTPCLIOptionsTest.lean
          lake env lean --run test/HTTP1Test.lean
          lake env lean --run test/HTTP1HeaderEventTest.lean
          lake env lean --run test/HTTP1ResponseTest.lean
          lake env lean --run test/HTTP1ClientResponseTest.lean
          lake env lean --run test/HTTP1ParserV2Test.lean
          lake env lean --run test/HTTP1EncodingTest.lean
          lake env lean --run test/HTTP1MachineTest.lean
          lake env lean --run test/HTTP1FileTest.lean
          lake env lean --run test/HTTP1ShutdownTest.lean
          lake env lean --run test/ResponseOutputTest.lean
          lake env lean --run test/HTTP2KeepaliveTest.lean
          lake env lean --run test/ObservabilityMetricsTest.lean
          lake env lean --run test/HTTP2PrefaceTest.lean
          lake env lean --run test/HTTP2FrameTest.lean
          lake env lean --run test/HTTP2FrameV2Test.lean
          lake env lean --run test/PriorityTest.lean
          lake env lean --run test/HTTP2MachineTest.lean
          lake env lean --run test/HPACKTest.lean
          lake env lean --run test/HTTP2RequestTest.lean
          lake env lean --run test/HTTP2StreamTest.lean
          lake env lean --run test/HTTP2ConnectionTest.lean
          lake env lean --run test/HTTP2ConnectionV2Test.lean
          lake env lean --run test/HTTP2FileTest.lean
          lake env lean --run test/HTTP2UpgradeTest.lean
          lake env lean --run test/HTTP2HeadGateTest.lean
          lake env lean --run test/WebSocketTest.lean
          lake env lean --run test/GateTest.lean
          lake env lean --run test/GatewayWireTest.lean
          .lake/build/bin/lean-net-gateway-h1-streaming-test
          .lake/build/bin/lean-net-gateway-h2-streaming-test
          lake env lean --run test/StaticSelectionTest.lean
          lake env lean --run test/TraceContextTest.lean
          python3 test/test_echo.py -v
          python3 test/test_http1_server.py -v
          .lake/build/bin/lean-net-event-ffi-test
          python3 test/test_ffi_live.py -v
          python3 test/test_pool_lifetime.py -v
          python3 test/test_http1_event.py -v
          python3 test/test_transport_scheduler.py -v
          python3 test/test_http1_faults.py -v
          python3 test/test_http2_e2e.py -v
          python3 test/test_resilience.py -v
          lake build lean-net-admission-fixture
          python3 test/test_admission.py -v
          lake build lean-net-gate-fixture
          python3 test/test_gate.py -v
          python3 test/test_ratelimit.py -v
          python3 test/test_gate_cli.py -v
          python3 test/test_gateway_runtime.py -v
          python3 test/test_gateway_cli.py -v
          python3 test/test_reactor_connect.py -v
          python3 test/test_gateway_resolve.py -v
          python3 test/test_admin.py -v
      - name: Short deterministic protocol fuzz and controller invariants
        run: |
          lake build lean-net-protocol-fuzz
          python3 test/fuzz_protocols.py --profile short --output "$RUNNER_TEMP/phase6-fuzz-linux-full"
          python3 test/test_production_harness.py -v
          python3 test/test_access_log.py -v
      - name: Preserve protocol fuzz seeds and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-fuzz-linux-full
          path: ${{ runner.temp }}/phase6-fuzz-linux-full
          if-no-files-found: ignore
          retention-days: 14
      - name: Build and test TLS package
        run: |
          lake -d tls build lean-net-tls lean-net-tls-fixture lean-net-tls-interruptible-test lean-net-tls-gateway-test
          python3 tls/test/test_tls.py -v
          python3 tls/test/test_tls_gateway.py -v
          python3 tls/test/test_tls_gateway_e2e.py -v
