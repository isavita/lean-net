name: Native TLS reactor

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tls:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: macos-latest
            python: python3
          - os: windows-latest
            python: python
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
      - name: Install Linux TLS tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev zlib1g-dev libbrotli-dev pkg-config openssl curl
          echo "LEAN_NET_TEST_OPENSSL=openssl" >> "$GITHUB_ENV"
          echo "LEAN_NET_TEST_CURL=curl" >> "$GITHUB_ENV"
      - name: Install macOS TLS tools
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 zlib brotli pkgconf curl
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LEAN_NET_TEST_OPENSSL=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"
          echo "LEAN_NET_TEST_CURL=$(brew --prefix curl)/bin/curl" >> "$GITHUB_ENV"
      - name: Install Windows MINGW64 TLS tools
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-brotli
      - name: Select Windows native toolchain and DLL paths
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $mingw = (Join-Path $env:MSYS2_LOCATION 'mingw64').Replace('\', '/')
          "$mingw/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$mingw/lib/pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LEAN_NET_TEST_OPENSSL=$mingw/bin/openssl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LEAN_NET_TEST_CURL=$mingw/bin/curl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Record TLS toolchain
        run: |
          pkg-config --atleast-version=1.1.1 openssl
          pkg-config --modversion openssl
          pkg-config --cflags --libs openssl
          "$LEAN_NET_TEST_OPENSSL" version
          "$LEAN_NET_TEST_CURL" --version
          lake env ${{ matrix.python }} -c 'import ssl, sys; print(sys.version); print(ssl.OPENSSL_VERSION); assert ssl.HAS_TLSv1_3'
      - name: Independent HTTP/2 test codec
        run: |
          lake env ${{ matrix.python }} -m pip install --require-hashes --target "$RUNNER_TEMP/lean-net-http2-test-deps" -r test/requirements-http2.txt
          echo "PYTHONPATH=$RUNNER_TEMP/lean-net-http2-test-deps" >> "$GITHUB_ENV"
      - name: Build public TLS APIs and native fixtures
        run: |
          lake build lean-net-http1 lean-net-platform-info lean-net-http2-reactor-fixture lean-net-static-fixture lean-net-observability-fixture lean-net-process-metrics-test lean-net-deferred-transport-fixture lean-net-keepalive-transport-fixture
          lake -d tls build lean-net-tls lean-net-tls-fixture lean-net-tls-interruptible-test lean-net-tls-reactor-fixture lean-net-tls-static-fixture lean-net-tls-reload-fixture lean-net-tls-worker-lifetime-test lean-net-tls-admission-fixture lean-net-tls-gateway-test
      - name: Public CLI queue configuration
        run: lake env lean --run test/HTTPCLIOptionsTest.lean
      - name: WebSocket HTTP/1 and HTTP/2 wire acceptance
        run: lake env ${{ matrix.python }} test/test_websocket.py -v
      - name: Context ownership and policy sanitizers
        if: runner.os != 'Windows'
        run: ${{ matrix.python }} tls/test/test_tls_context_native.py -v
      - name: TLS byte lanes, wire fences and worker lifetime sanitizers
        if: runner.os != 'Windows'
        run: ${{ matrix.python }} tls/test/test_tls_worker_native.py -v
      - name: Certificate loader snapshots and thousand-generation retirement
        run: lake env ${{ matrix.python }} tls/test/test_tls_reload_native.py -v
      - name: Verified certificate reload, failure retention and public CLI
        run: lake env ${{ matrix.python }} tls/test/test_tls_reload.py -v
      - name: Escaped TLS worker callbacks reject closed owners
        run: lake env ${{ matrix.python }} tls/test/test_tls_worker_lifetime.py -v
      - name: Verified native TLS, SNI, ALPN and resumption acceptance
        env:
          LEAN_NET_TLS_CYCLES: '1000'
        run: lake env ${{ matrix.python }} tls/test/test_tls_reactor.py -v
      - name: Verified upstream TLS client and gateway forwarding
        run: |
          lake env ${{ matrix.python }} tls/test/test_tls_gateway.py -v
          lake env ${{ matrix.python }} tls/test/test_tls_gateway_e2e.py -v
          lake env ${{ matrix.python }} tls/test/test_tls_connection_rate.py -v
      - name: Production TLS policy (mTLS, OCSP, ciphers, curl matrix)
        run: lake env ${{ matrix.python }} tls/test/test_tls_production.py -v
      - name: HTTP/2 frame isolation, priorities, push and TLS acceptance
        run: lake env ${{ matrix.python }} test/test_http2_reactor.py -v
      - name: Public HTTP/2 CLI push acceptance
        run: lake env ${{ matrix.python }} test/test_http2_cli.py -v
      - name: Active HTTP/2 keepalive and physical write fences
        run: lake env ${{ matrix.python }} test/test_http2_keepalive.py -v
      - name: Static files, validators, compression and file lifetimes
        run: lake env ${{ matrix.python }} test/test_static_files.py -v
      - name: Actual completion metrics and private access logs
        run: |
          .lake/build/bin/lean-net-process-metrics-test
          lake env ${{ matrix.python }} test/test_observability.py -v
      - name: Historical async completion before provider retirement
        run: lake env ${{ matrix.python }} test/test_deferred_transport.py -v
