name: Native reactor

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      compare_http1:
        description: Compare HTTP/1.1 with Go, Uvicorn and Puma on Linux and upload raw results
        type: boolean
        default: false

jobs:
  native:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: macos-latest
            python: python3
          - os: windows-latest
            python: python
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux file codecs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libuv1-dev libssl-dev zlib1g-dev libbrotli-dev pkg-config
          echo "LEAN_CC=cc" >> "$GITHUB_ENV"
      - name: Install macOS file codecs
        if: runner.os == 'macOS'
        run: |
          brew install zlib brotli pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix zlib)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
      - name: Install Windows native toolchain and file codecs
        if: runner.os == 'Windows'
        id: codecs
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-brotli
            mingw-w64-x86_64-pkgconf
      - name: Select Windows codec DLLs and compiler
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.codecs.outputs.msys2-location }}
        run: |
          $mingw = (Join-Path $env:MSYS2_LOCATION 'mingw64').Replace('\', '/')
          "$mingw/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$mingw/lib/pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
      - name: Build reactor and echo
        run: lake build lean-net-echo lean-net-http1 lean-net-platform-info lean-net-reactor-native-test lean-net-http1-reactor-fixture lean-net-http2-reactor-fixture lean-net-static-fixture lean-net-protocol-fuzz lean-net-gateway-pool-test lean-net-gateway-engine-test lean-net-gateway-h1-streaming-test lean-net-gateway-h2-streaming-test lean-net-atomic-flag-test
      - name: Shared atomic flag monotonicity and native reclamation
        run: .lake/build/bin/lean-net-atomic-flag-test
      - name: Pure HTTP/1 protocol machines
        run: |
          lake env lean --run test/HTTP1ParserV2Test.lean
          lake env lean --run test/HTTP1EncodingTest.lean
          lake env lean --run test/HTTP1ClientResponseTest.lean
          lake env lean --run test/HTTP1MachineTest.lean
          lake env lean --run test/HTTP1FileTest.lean
          lake env lean --run test/HTTP1ShutdownTest.lean
          lake env lean --run test/ResponseOutputTest.lean
          lake env lean --run test/HTTP2KeepaliveTest.lean
          lake env lean --run test/ObservabilityMetricsTest.lean
          lake env lean --run test/HTTP2UpgradeTest.lean
          lake env lean --run test/WebSocketTest.lean
      - name: Pure HTTP/2 protocol machines
        run: |
          lake env lean --run test/HTTP2FrameTest.lean
          lake env lean --run test/HTTP2FrameV2Test.lean
          lake env lean --run test/HPACKTest.lean
          lake env lean --run test/HTTP2RequestTest.lean
          lake env lean --run test/HTTP2StreamTest.lean
          lake env lean --run test/HTTP2ConnectionTest.lean
          lake env lean --run test/HTTP2ConnectionV2Test.lean
          lake env lean --run test/PriorityTest.lean
          lake env lean --run test/HTTP2MachineTest.lean
          lake env lean --run test/HTTP2FileTest.lean
      - name: Gateway policy, wire and streaming machines
        run: |
          lake build LeanNet.Gate.Literal
          lake env lean --run test/GateTest.lean
          lake env lean --run test/GatewayWireTest.lean
          .lake/build/bin/lean-net-gateway-h1-streaming-test
          .lake/build/bin/lean-net-gateway-h2-streaming-test
      - name: Pure static selection, paths and dates
        run: lake env lean --run test/StaticSelectionTest.lean
      - name: Short deterministic protocol fuzz and controller invariants
        run: |
          lake env ${{ matrix.python }} test/fuzz_protocols.py --profile short --output "$RUNNER_TEMP/phase6-fuzz-${{ runner.os }}"
          lake env ${{ matrix.python }} test/test_production_harness.py -v
      - name: Preserve protocol fuzz seeds and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-fuzz-${{ runner.os }}
          path: ${{ runner.temp }}/phase6-fuzz-${{ runner.os }}
          if-no-files-found: ignore
          retention-days: 14
      - name: Bounded access log helper ownership and output
        run: lake env ${{ matrix.python }} test/test_access_log.py -v
      - name: Packed static codecs and publication (Unix)
        if: runner.os != 'Windows'
        run: python3 test/test_static_catalog.py -v
      - name: Packed static codecs and publication (Windows)
        if: runner.os == 'Windows'
        run: lake env python test/test_static_catalog.py -v
      - name: Phantom lifecycle checks
        run: lake env lean test/ReactorStateTest.lean
      - name: Native buffers, timers and generations
        run: .lake/build/bin/lean-net-reactor-native-test
      - name: Gateway sockets, pool, and public CLI
        run: |
          lake env ${{ matrix.python }} test/test_gateway_runtime.py -v
          lake env ${{ matrix.python }} test/test_gateway_cli.py -v
          lake env ${{ matrix.python }} test/test_connection_rate.py -v
      - name: Native upstream connect and resolver (Unix)
        if: runner.os != 'Windows'
        run: |
          python3 test/test_reactor_connect.py -v
          python3 test/test_gateway_resolve.py -v
      - name: Worker echo and FFI setup ownership (Unix)
        if: runner.os != 'Windows'
        run: |
          python3 test/test_reactor_setup.py -v
          python3 test/test_reactor_wire.py -v
          python3 test/test_reactor_echo.py -v
          python3 test/test_http1_reactor.py -v
          python3 test/test_graceful_shutdown.py -v
          python3 test/test_resilience.py -v
          python3 test/test_ratelimit.py -v
          python3 test/test_admin.py -v
      - name: Worker echo and FFI setup ownership (Windows)
        if: runner.os == 'Windows'
        run: |
          lake env python test/test_reactor_setup.py -v
          lake env python test/test_reactor_wire.py -v
          lake env python test/test_reactor_echo.py -v
          lake env python test/test_http1_reactor.py -v
          lake env python test/test_graceful_shutdown.py -v
      - name: Echo acceptance
        if: runner.os != 'Windows'
        run: python3 test/test_echo.py -v
      - name: HTTP/1.1 and h2c connection churn
        if: runner.os != 'Windows'
        run: python3 test/soak.py --count 10000 --warmup 500 --batch 1000 --concurrency 16
      - name: Native signal and endpoint ownership
        if: runner.os != 'Windows'
        run: |
          python3 test/test_reactor_group.py -v
          python3 test/test_reactor_cpu.py -v
      - name: Pooled I/O allocation and lifecycle sanitizers
        if: runner.os != 'Windows'
        run: |
          python3 test/test_reactor_posix.py -v
          python3 test/test_reactor_file.py -v
      - name: macOS accept handoff distribution and ownership
        if: runner.os == 'macOS'
        run: python3 test/test_reactor_dispatch.py -v
      - name: IOCP operations and cancellation lifetime
        if: runner.os == 'Windows'
        run: lake env python test/test_windows_native.py -v
      - name: Set up Go for optional HTTP/1.1 comparison
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.compare_http1
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false
      - name: Set up Python for optional HTTP/1.1 comparison
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.compare_http1
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.10'
      - name: Set up Ruby for optional HTTP/1.1 comparison
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.compare_http1
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
      - name: Install pinned HTTP/1.1 reference servers
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.compare_http1
        run: |
          python3 -m venv "$RUNNER_TEMP/http1-python"
          "$RUNNER_TEMP/http1-python/bin/python" -m pip install --requirement test/benchmarks/python-http1-requirements.txt
          bash test/benchmarks/install_ruby_http1.sh "$RUNNER_TEMP/http1-ruby"
      - name: Compare HTTP/1.1 with Go, Uvicorn and Puma
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.compare_http1
        run: |
          go version
          python3 test/benchmarks/compare_http1.py --workers 4 --rounds 3 \
            --references go uvicorn puma \
            --uvicorn-python "$RUNNER_TEMP/http1-python/bin/python" \
            --puma-exe "$RUNNER_TEMP/http1-ruby/bin/puma" \
            --ruby-gem-home "$RUNNER_TEMP/http1-ruby" \
            --output "$RUNNER_TEMP/http1-comparison-linux.json"
      - name: Preserve HTTP/1.1 comparison
        if: success() && runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.compare_http1
        uses: actions/upload-artifact@v4
        with:
          name: http1-comparison-linux-four-way
          path: ${{ runner.temp }}/http1-comparison-linux.json
          if-no-files-found: error
          retention-days: 30
