name: Native reactor

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: macos-latest
            python: python3
          - os: windows-latest
            python: python
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux file codecs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libbrotli-dev pkg-config
      - name: Install macOS file codecs
        if: runner.os == 'macOS'
        run: |
          brew install zlib brotli pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix zlib)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
      - name: Install Windows native toolchain and file codecs
        if: runner.os == 'Windows'
        id: codecs
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-brotli
            mingw-w64-x86_64-pkgconf
      - name: Select Windows codec DLLs and compiler
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.codecs.outputs.msys2-location }}
        run: |
          $mingw = (Join-Path $env:MSYS2_LOCATION 'mingw64').Replace('\', '/')
          "$mingw/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$mingw/lib/pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
      - name: Build reactor and echo
        run: lake build lean-net-echo lean-net-reactor-native-test lean-net-http1-reactor-fixture lean-net-http2-reactor-fixture lean-net-static-fixture lean-net-protocol-fuzz
      - name: Pure HTTP/1 protocol machines
        run: |
          lake env lean --run test/HTTP1ParserV2Test.lean
          lake env lean --run test/HTTP1EncodingTest.lean
          lake env lean --run test/HTTP1MachineTest.lean
          lake env lean --run test/HTTP1FileTest.lean
          lake env lean --run test/HTTP1ShutdownTest.lean
          lake env lean --run test/ResponseOutputTest.lean
          lake env lean --run test/ObservabilityMetricsTest.lean
      - name: Pure HTTP/2 protocol machines
        run: |
          lake env lean --run test/HTTP2FrameTest.lean
          lake env lean --run test/HTTP2FrameV2Test.lean
          lake env lean --run test/HPACKTest.lean
          lake env lean --run test/HTTP2RequestTest.lean
          lake env lean --run test/HTTP2StreamTest.lean
          lake env lean --run test/HTTP2ConnectionTest.lean
          lake env lean --run test/HTTP2ConnectionV2Test.lean
          lake env lean --run test/PriorityTest.lean
          lake env lean --run test/HTTP2MachineTest.lean
          lake env lean --run test/HTTP2FileTest.lean
      - name: Pure static selection, paths and dates
        run: lake env lean --run test/StaticSelectionTest.lean
      - name: Short deterministic protocol fuzz and controller invariants
        run: |
          lake env ${{ matrix.python }} test/fuzz_protocols.py --profile short --output "$RUNNER_TEMP/phase6-fuzz-${{ runner.os }}"
          lake env ${{ matrix.python }} test/test_production_harness.py -v
      - name: Preserve protocol fuzz seeds and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-fuzz-${{ runner.os }}
          path: ${{ runner.temp }}/phase6-fuzz-${{ runner.os }}
          if-no-files-found: ignore
          retention-days: 14
      - name: Bounded access log helper ownership and output
        run: lake env ${{ matrix.python }} test/test_access_log.py -v
      - name: Packed static codecs and publication (Unix)
        if: runner.os != 'Windows'
        run: python3 test/test_static_catalog.py -v
      - name: Packed static codecs and publication (Windows)
        if: runner.os == 'Windows'
        run: lake env python test/test_static_catalog.py -v
      - name: Phantom lifecycle checks
        run: lake env lean test/ReactorStateTest.lean
      - name: Native buffers, timers and generations
        run: .lake/build/bin/lean-net-reactor-native-test
      - name: Worker echo and FFI setup ownership (Unix)
        if: runner.os != 'Windows'
        run: |
          python3 test/test_reactor_setup.py -v
          python3 test/test_reactor_wire.py -v
          python3 test/test_reactor_echo.py -v
          python3 test/test_http1_reactor.py -v
          python3 test/test_graceful_shutdown.py -v
      - name: Worker echo and FFI setup ownership (Windows)
        if: runner.os == 'Windows'
        run: |
          lake env python test/test_reactor_setup.py -v
          lake env python test/test_reactor_wire.py -v
          lake env python test/test_reactor_echo.py -v
          lake env python test/test_http1_reactor.py -v
          lake env python test/test_graceful_shutdown.py -v
      - name: Echo acceptance
        if: runner.os != 'Windows'
        run: python3 test/test_echo.py -v
      - name: Native signal and endpoint ownership
        if: runner.os != 'Windows'
        run: python3 test/test_reactor_group.py -v
      - name: Pooled I/O allocation and lifecycle sanitizers
        if: runner.os != 'Windows'
        run: |
          python3 test/test_reactor_posix.py -v
          python3 test/test_reactor_file.py -v
      - name: macOS accept handoff distribution and ownership
        if: runner.os == 'macOS'
        run: python3 test/test_reactor_dispatch.py -v
      - name: IOCP operations and cancellation lifetime
        if: runner.os == 'Windows'
        run: lake env python test/test_windows_native.py -v
