name = "lean-net-examples"
version = "0.1.2"
reservoir = false
defaultTargets = ["hello-server", "api-server", "tls-static-server", "gateway-server"]

[[require]]
name = "lean-net-tls"
path = "../tls"

[[lean_exe]]
name = "hello-server"
root = "Hello"

[[lean_exe]]
name = "api-server"
root = "Api"

[[lean_exe]]
name = "tls-static-server"
root = "TlsStatic"

[[lean_exe]]
name = "gateway-server"
root = "Gateway"
